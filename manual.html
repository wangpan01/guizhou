<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>产品手册预览 - 贵州理科微波</title>
  <style>
    :root {
      --primary: #1a3c6e;
      --accent: #e84c3d;
      --text-light: #666;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      background: #525659;
    }
    .manual-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 20px;
      background: var(--primary);
      color: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .manual-header button {
      color: rgba(255,255,255,0.9);
      font-size: 14px;
      white-space: nowrap;
      padding: 6px 12px;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      transition: background 0.2s;
      font-family: inherit;
    }
    .manual-header button:hover { background: rgba(255,255,255,0.12); }
    .manual-header h1 {
      flex: 1;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.4;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .manual-header .note {
      font-size: 12px;
      color: rgba(255,255,255,0.65);
      white-space: nowrap;
    }
    .manual-viewer {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px;
      user-select: none;
      -webkit-user-select: none;
    }
    /* 微信等内核里 display:flex 会盖掉 [hidden]，必须显式隐藏 */
    .manual-status[hidden],
    #pdfPages[hidden] {
      display: none !important;
    }
    .manual-status {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 200px;
      padding: 32px 24px;
      color: rgba(255,255,255,0.9);
      text-align: center;
      gap: 12px;
    }
    .manual-status.is-active {
      display: flex;
    }
    .manual-status p { font-size: 14px; line-height: 1.7; color: rgba(255,255,255,0.75); }
    .manual-status button {
      margin-top: 8px;
      color: #fff;
      background: var(--accent);
      padding: 10px 24px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    #pdfPages {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      max-width: 920px;
      margin: 0 auto;
    }
    #pdfPages.is-active {
      display: flex;
    }
    .pdf-page-wrap {
      background: #fff;
      box-shadow: 0 2px 12px rgba(0,0,0,0.35);
      line-height: 0;
    }
    .pdf-page-wrap canvas {
      display: block;
      max-width: 100%;
      height: auto;
    }
    @media (max-width: 640px) {
      .manual-header { flex-wrap: wrap; padding: 10px 14px; }
      .manual-header .note { width: 100%; order: 3; }
      .manual-header h1 { font-size: 14px; white-space: normal; }
      .manual-viewer { padding: 10px; }
    }
  </style>
</head>
<body>
  <header class="manual-header">
    <button type="button" id="backBtn">← 返回</button>
    <h1 id="manualTitle">产品手册</h1>
    <span class="note">在线预览 · 不支持下载</span>
  </header>
  <main id="pdfViewer" class="manual-viewer">
    <div id="pdfLoading" class="manual-status is-active">
      <p>正在加载手册，请稍候…</p>
    </div>
    <div id="pdfPages"></div>
    <div id="pdfError" class="manual-status">
      <p id="pdfErrorMsg">手册预览加载失败，请检查网络后重试。</p>
      <button type="button" id="retryBtn">重新加载</button>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    const MANUALS = {
      filter: {
        src: 'txt/贵州理科微波滤波器产品手册V2.0.pdf',
        title: '贵州理科微波滤波器产品手册 V2.0'
      },
      divider: {
        src: 'txt/贵州理科微波功分器产品手册V2.0(1).pdf',
        title: '贵州理科微波功分器产品手册 V2.0'
      },
      bridge: {
        src: 'txt/贵州理科微波电桥产品手册V2.0.pdf',
        title: '贵州理科微波电桥产品手册 V2.0'
      }
    };

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    function getPageBasePath() {
      const path = window.location.pathname || '/';
      if (path.endsWith('/')) return path;
      if (/\.[a-zA-Z0-9]+$/.test(path)) return path.slice(0, path.lastIndexOf('/') + 1);
      return path + '/';
    }

    function resolvePath(src) {
      if (/^(https?:|data:|blob:|\/\/|\/)/i.test(src)) return src;
      const rel = src.replace(/^\.?\//, '');
      const encoded = rel.split('/').map((part) => encodeURIComponent(part)).join('/');
      return getPageBasePath() + encoded;
    }

    function goBack() {
      if (window.opener && !window.opener.closed) {
        try { window.opener.focus(); } catch (_) {}
        window.close();
        return;
      }
      if (window.history.length > 1) {
        window.history.back();
        return;
      }
      location.href = 'index.html#products';
    }

    document.getElementById('backBtn').addEventListener('click', goBack);

    const params = new URLSearchParams(location.search);
    const type = params.get('type') || 'filter';
    const manual = MANUALS[type] || MANUALS.filter;
    const pdfUrl = resolvePath(manual.src);

    document.title = manual.title + ' - 贵州理科微波';
    document.getElementById('manualTitle').textContent = manual.title;

    const viewer = document.getElementById('pdfViewer');
    const loadingEl = document.getElementById('pdfLoading');
    const pagesEl = document.getElementById('pdfPages');
    const errorEl = document.getElementById('pdfError');
    const errorMsg = document.getElementById('pdfErrorMsg');

    viewer.addEventListener('contextmenu', (e) => e.preventDefault());
    viewer.addEventListener('dragstart', (e) => e.preventDefault());

    function setView(mode) {
      loadingEl.classList.toggle('is-active', mode === 'loading');
      errorEl.classList.toggle('is-active', mode === 'error');
      pagesEl.classList.toggle('is-active', mode === 'pages');
    }

    function showError(msg) {
      if (msg) errorMsg.textContent = msg;
      setView('error');
    }

    function showPages() {
      setView('pages');
    }

    /** 布局未完成时 clientWidth 可能为 0，不能用 `a || b-32`（0 会落到负数） */
    function getMaxWidth() {
      const w = viewer.clientWidth || document.documentElement.clientWidth || window.innerWidth;
      return Math.max(280, Math.min(w - 32, 900));
    }

    function whenLayoutReady() {
      return new Promise((resolve) => {
        const run = () => {
          if (getMaxWidth() >= 280) {
            resolve();
            return;
          }
          requestAnimationFrame(run);
        };
        if (document.readyState === 'complete') requestAnimationFrame(run);
        else window.addEventListener('load', () => requestAnimationFrame(run), { once: true });
      });
    }

    let renderGen = 0;

    async function renderPdf() {
      const gen = ++renderGen;
      setView('loading');
      pagesEl.innerHTML = '';

      try {
        await whenLayoutReady();
        if (gen !== renderGen) return;

        const pdf = await pdfjsLib.getDocument({ url: pdfUrl, withCredentials: false }).promise;
        if (gen !== renderGen) return;

        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const maxWidth = getMaxWidth();

        for (let num = 1; num <= pdf.numPages; num++) {
          const page = await pdf.getPage(num);
          if (gen !== renderGen) return;

          const baseViewport = page.getViewport({ scale: 1 });
          const scale = Math.max(0.25, Math.min(maxWidth / baseViewport.width, 2));
          const viewport = page.getViewport({ scale: scale * dpr });

          const canvas = document.createElement('canvas');
          const w = Math.floor(viewport.width);
          const h = Math.floor(viewport.height);
          if (w < 1 || h < 1) throw new Error('Invalid canvas size');

          canvas.width = w;
          canvas.height = h;
          canvas.style.width = (w / dpr) + 'px';
          canvas.style.height = (h / dpr) + 'px';

          await page.render({
            canvasContext: canvas.getContext('2d'),
            viewport
          }).promise;

          const wrap = document.createElement('div');
          wrap.className = 'pdf-page-wrap';
          wrap.appendChild(canvas);
          pagesEl.appendChild(wrap);
        }

        if (gen !== renderGen) return;
        showPages();
      } catch (err) {
        if (gen !== renderGen) return;
        console.error(err);
        const isFileProtocol = location.protocol === 'file:';
        showError(
          isFileProtocol
            ? '请通过 Web 服务器访问本页面后再预览（直接打开本地文件无法加载手册）。'
            : '手册预览加载失败，请检查网络连接后重试。'
        );
      }
    }

    document.getElementById('retryBtn').addEventListener('click', renderPdf);
    renderPdf();
  </script>
</body>
</html>
