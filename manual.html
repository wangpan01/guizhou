<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>产品手册预览 - 贵州理科微波</title>
  <style>
    :root {
      --primary: #1a3c6e;
      --accent: #e84c3d;
      --text-light: #666;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      background: #525659;
    }
    .manual-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 20px;
      background: var(--primary);
      color: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .manual-header button {
      color: rgba(255,255,255,0.9);
      font-size: 14px;
      white-space: nowrap;
      padding: 6px 12px;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      transition: background 0.2s;
      font-family: inherit;
    }
    .manual-header button:hover { background: rgba(255,255,255,0.12); }
    .manual-header h1 {
      flex: 1;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.4;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .manual-header .note {
      font-size: 12px;
      color: rgba(255,255,255,0.65);
      white-space: nowrap;
    }
    .manual-frame {
      flex: 1;
      min-height: 0;
      border: none;
      width: 100%;
      background: #525659;
    }
    .manual-fallback {
      display: none;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      color: #fff;
      text-align: center;
    }
    .manual-fallback p { font-size: 14px; color: rgba(255,255,255,0.8); line-height: 1.7; }
    .manual-fallback a {
      color: #fff;
      background: var(--accent);
      padding: 10px 24px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }
    @media (max-width: 640px) {
      .manual-header { flex-wrap: wrap; padding: 10px 14px; }
      .manual-header .note { width: 100%; order: 3; }
      .manual-header h1 { font-size: 14px; white-space: normal; }
    }
  </style>
</head>
<body>
  <header class="manual-header">
    <button type="button" id="backBtn">← 返回</button>
    <h1 id="manualTitle">产品手册</h1>
    <span class="note">浏览器在线预览 · 仅供浏览</span>
  </header>
  <iframe id="pdfFrame" class="manual-frame" title="产品手册预览"></iframe>
  <div id="manualFallback" class="manual-fallback">
    <p>当前环境无法内嵌预览，请点击下方按钮使用浏览器打开手册。</p>
    <a id="openPdfLink" href="#">在浏览器中打开手册</a>
  </div>

  <script>
    const MANUALS = {
      filter: {
        src: 'txt/贵州理科微波滤波器产品手册V2.0.pdf',
        title: '贵州理科微波滤波器产品手册 V2.0'
      },
      divider: {
        src: 'txt/贵州理科微波功分器产品手册V2.0(1).pdf',
        title: '贵州理科微波功分器产品手册 V2.0'
      },
      bridge: {
        src: 'txt/贵州理科微波电桥产品手册V2.0.pdf',
        title: '贵州理科微波电桥产品手册 V2.0'
      }
    };

    function getPageBasePath() {
      const path = window.location.pathname || '/';
      if (path.endsWith('/')) return path;
      if (/\.[a-zA-Z0-9]+$/.test(path)) return path.slice(0, path.lastIndexOf('/') + 1);
      return path + '/';
    }

    function resolvePath(src) {
      if (/^(https?:|data:|blob:|\/\/|\/)/i.test(src)) return src;
      const rel = src.replace(/^\.?\//, '');
      const encoded = rel.split('/').map((part) => encodeURIComponent(part)).join('/');
      return getPageBasePath() + encoded;
    }

    function goBack() {
      // 从新标签页打开时：回到原页面并关闭当前预览页
      if (window.opener && !window.opener.closed) {
        try { window.opener.focus(); } catch (_) {}
        window.close();
        return;
      }
      // 同页跳转：浏览器后退
      if (window.history.length > 1) {
        window.history.back();
        return;
      }
      location.href = 'index.html#products';
    }

    document.getElementById('backBtn').addEventListener('click', goBack);

    const params = new URLSearchParams(location.search);
    const type = params.get('type') || 'filter';
    const manual = MANUALS[type] || MANUALS.filter;

    const pdfUrl = resolvePath(manual.src);
    document.title = manual.title + ' - 贵州理科微波';
    document.getElementById('manualTitle').textContent = manual.title;

    const frame = document.getElementById('pdfFrame');
    const fallback = document.getElementById('manualFallback');
    const openLink = document.getElementById('openPdfLink');
    openLink.href = pdfUrl;

    // 使用浏览器内置 PDF 查看器（embed 通过 iframe 加载）
    frame.src = pdfUrl + '#toolbar=0&navpanes=0';

    // 部分移动端不支持 iframe 内嵌 PDF，提供降级
    const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
    if (isMobile) {
      frame.style.display = 'none';
      fallback.style.display = 'flex';
      // 移动端直接跳转浏览器预览
      location.replace(pdfUrl);
    }

    frame.addEventListener('error', () => {
      frame.style.display = 'none';
      fallback.style.display = 'flex';
    });
  </script>
</body>
</html>
